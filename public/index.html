<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARC — Agenda Rock Cristão</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    background:#08080a;
    min-height:100%;
  }

  body {
    font-family:'Barlow Condensed', sans-serif;
    color:#f2f0ea;
    display:flex;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- fundo texturizado ---------- */
  .bg-layer {
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .bg-base {
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 90% 50% at 50% 0%, rgba(60,8,10,0.55), transparent 60%),
      radial-gradient(ellipse 70% 40% at 100% 100%, rgba(60,8,10,0.35), transparent 60%),
      #08080a;
  }
  .bg-dots {
    position:absolute;
    width:60vw; height:60vw;
    background-image: radial-gradient(rgba(226,16,31,0.5) 1.5px, transparent 2px);
    background-size: 14px 14px;
    -webkit-mask-image: radial-gradient(circle, black 20%, transparent 70%);
    mask-image: radial-gradient(circle, black 20%, transparent 70%);
    opacity:0.55;
  }
  .bg-dots.top-right { top:-10vw; right:-15vw; }
  .bg-dots.bottom-left { bottom:-10vw; left:-15vw; }

  .bg-streak {
    position:absolute;
    background:linear-gradient(90deg, rgba(226,16,31,0.55), rgba(226,16,31,0));
    filter:blur(1px);
  }
  .streak-1 { width:140vw; height:6px; top:8%; right:-20vw; transform:rotate(-20deg); }
  .streak-2 { width:120vw; height:3px; top:12%; right:-10vw; transform:rotate(-20deg); opacity:0.6; }
  .streak-3 { width:130vw; height:5px; bottom:14%; left:-25vw; transform:rotate(-20deg) scaleX(-1); }
  .streak-4 { width:110vw; height:3px; bottom:10%; left:-15vw; transform:rotate(-20deg) scaleX(-1); opacity:0.5; }

  .bg-bolt {
    position:absolute;
    opacity:0.045;
    color:#fff;
  }
  .bolt-1 { width:90px; top:4%; left:-2%; transform:rotate(-8deg); }
  .bolt-2 { width:70px; bottom:6%; right:0%; transform:rotate(10deg); }

  /* ---------- conteúdo ---------- */
  .wrap {
    position:relative;
    z-index:1;
    width:100%;
    max-width:480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:44px 22px 40px;
  }

  .logo-main {
    width:66%;
    max-width:300px;
    filter:drop-shadow(0 6px 24px rgba(226,16,31,0.35));
    -webkit-mask-image: radial-gradient(closest-side, black 78%, transparent 100%);
    mask-image: radial-gradient(closest-side, black 78%, transparent 100%);
  }

  .lema {
    margin-top:26px;
    font-family:'Anton', sans-serif;
    font-size:32px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    text-align:center;
    line-height:1.1;
  }
  .lema .accent { color:#e2101f; }

  .lema-underline {
    width:150px;
    margin-top:10px;
  }

  .subtitulo {
    margin-top:14px;
    font-size:17px;
    color:#a8a49e;
    text-align:center;
    line-height:1.5;
    max-width:340px;
  }

  /* ---------- botões ---------- */
  .actions {
    width:100%;
    margin-top:36px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .btn {
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    text-decoration:none;
    color:#f2f0ea;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    transition:transform .08s ease, filter .08s ease;
  }
  .btn:visited { color:#f2f0ea; }
  .btn:active { transform:translateY(2px) scale(0.99); filter:brightness(0.94); }

  .btn-icon {
    width:44px;
    height:44px;
    border-radius:50%;
    object-fit:cover;
    flex:0 0 auto;
  }
  .btn-icon-fallback {
    width:44px;
    height:44px;
    border-radius:50%;
    background:#0b0b0c;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .btn-text {
    flex:1 1 auto;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .btn-title {
    font-family:'Anton', sans-serif;
    font-size:16.5px;
    letter-spacing:0.2px;
    text-transform:uppercase;
    line-height:1.15;
    white-space:nowrap;
  }
  .btn-sub {
    font-size:13px;
    color:#b9b5ae;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .btn-chevron {
    flex:0 0 auto;
    width:18px;
    height:18px;
  }

  /* botão primário — cadastrar agenda */
  .btn-primary {
    background:linear-gradient(135deg, rgba(226,16,31,0.55), rgba(120,10,10,0.28));
    border:1.5px solid rgba(226,16,31,0.7);
    box-shadow:0 4px 18px rgba(226,16,31,0.18);
  }
  .btn-primary .btn-sub { color:rgba(255,255,255,0.82); }

  /* botão spotify */
  .btn-spotify {
    background:rgba(21,21,22,0.7);
    border:1.5px solid rgba(29,185,84,0.65);
  }
  .btn-spotify .btn-title { color:#1DB954; }

  /* botão fábrica de canções */
  .btn-fabrica {
    background:rgba(21,21,22,0.7);
    border:1.5px solid #2a2a2b;
  }
  .badge-em-breve {
    flex:0 0 auto;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.3px;
    text-transform:uppercase;
    color:#f2a900;
    border:1px solid #f2a900;
    border-radius:5px;
    padding:2px 6px;
    white-space:nowrap;
  }

  /* ---------- redes sociais ---------- */
  .socials {
    display:flex;
    gap:14px;
    margin-top:34px;
  }
  .social-btn {
    width:46px;
    height:46px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#c9c6c0;
    text-decoration:none;
    touch-action:manipulation;
    transition:transform .08s ease, background .08s ease;
  }
  .social-btn:active { transform:scale(0.92); background:rgba(255,255,255,0.12); }

  .footer-note {
    margin-top:30px;
    font-size:13px;
    color:#7a7670;
    text-align:center;
    line-height:1.5;
  }
  .footer-note .accent { color:#e2101f; }
</style>
</head>

</div>
